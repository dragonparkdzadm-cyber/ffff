<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5eee3">
  <title>Знайди правильну відповідь</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: linear-gradient(145deg, #f8f1e7, #e9dfd0);
      font-family: Arial, sans-serif; color: #30291f;
    }
    main {
      width: min(100%, 430px); background: #fffdf9; border-radius: 24px;
      padding: 32px 24px; text-align: center;
      box-shadow: 0 14px 40px rgba(62, 44, 20, .12);
    }
    .lock { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 27px; margin: 0 0 12px; }
    p { color: #756b5e; line-height: 1.5; margin: 0 0 24px; }
    input {
      width: 100%; padding: 16px; border: 2px solid #ded3c4; border-radius: 12px;
      font-size: 22px; text-align: center; outline: none; margin-bottom: 14px;
    }
    input:focus { border-color: #b8894b; }
    button {
      width: 100%; padding: 16px; border: 0; border-radius: 12px;
      background: #8a6237; color: white; font-size: 17px; font-weight: bold;
      cursor: pointer;
    }
    button:active { transform: scale(.99); }
    #message {
      display: none; margin-top: 22px; padding: 18px; border-radius: 14px;
      line-height: 1.5; font-size: 18px; font-weight: bold;
      background: #f4eee5;
    }
    #message.success { display: block; background: #e8f4e8; color: #245b2b; }
    #message.retry { display: block; background: #f7f0e5; color: #6d4a20; }
    #message.hint { display: block; background: #fff0d9; color: #744711; }
  </style>
</head>
<body>
  <main>
    <div class="lock">🔐</div>
    <h1>Знайди правильну відповідь!</h1>
    <p>Введи число, щоб дізнатися, куди рухатися далі.</p>
    <form id="answerForm">
      <input id="answer" type="number" inputmode="numeric" placeholder="Введи число..." aria-label="Введи число" required>
      <button type="submit">Перевірити</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <script>
    let wrongAttempts = 0;
    const form = document.getElementById('answerForm');
    const input = document.getElementById('answer');
    const message = document.getElementById('message');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const value = input.value.trim();
      if (value === '') return;

      if (value === '22') {
        message.className = 'success';
        message.textContent = '🎉 Правильно! Шукай далі у шафчику №22!';
        input.disabled = true;
        form.querySelector('button').disabled = true;
        form.querySelector('button').textContent = 'Відповідь знайдено';
      } else {
        wrongAttempts++;
        if (wrongAttempts < 4) {
          message.className = 'retry';
          message.textContent = 'Не вірно! Ми віримо в тебе, спробуй ще! 💪';
        } else {
          message.className = 'hint';
          message.textContent = '💡 Підказка: зверни увагу на множення!';
        }
      }
      input.value = '';
      if (!input.disabled) input.focus();
    });
  </script>
</body>
</html>
